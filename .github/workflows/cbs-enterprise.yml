name: CBS Enterprise Automation

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 1 * * *'   # Nightly — runs both banks
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options: [sanity, smoke, regression, e2e]
      bank:
        description: 'Bank code'
        required: true
        default: 'BDCC'
        type: choice
        options: [BDCC, BCCB]
      env:
        description: 'Environment'
        required: true
        default: 'QA'
        type: choice
        options: [QA, UAT]

env:
  NODE_VERSION: '20'

# ── Reusable env block per bank ───────────────────────────────────────────────
# Each job inlines its own env: block to keep secrets scoped correctly.

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # BDCC — Bagalkot District Central Co-operative Bank (port 8083, Oracle)
  # ════════════════════════════════════════════════════════════════════════════

  sanity-bdcc:
    name: Sanity — BDCC QA
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run sanity — BDCC QA
        run: npx playwright test --grep @sanity
        env:
          BANK:             BDCC
          ENV:              QA
          BASE_URL:         ${{ secrets.BDCC_BASE_URL }}
          MAKER_USERNAME:   ${{ secrets.BDCC_MAKER_USERNAME }}
          MAKER_PASSWORD:   ${{ secrets.BDCC_MAKER_PASSWORD }}
          CHECKER_USERNAME: ${{ secrets.BDCC_CHECKER_USERNAME }}
          CHECKER_PASSWORD: ${{ secrets.BDCC_CHECKER_PASSWORD }}
          DB_HOST:          ${{ secrets.BDCC_DB_HOST }}
          DB_NAME:          ${{ secrets.BDCC_DB_NAME }}
          DB_USER:          ${{ secrets.BDCC_DB_USER }}
          DB_PASSWORD:      ${{ secrets.BDCC_DB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-bdcc-qa
          path: allure-results/

  smoke-bdcc:
    name: Smoke — BDCC QA
    runs-on: ubuntu-latest
    needs: sanity-bdcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke — BDCC QA
        run: npx playwright test --grep @smoke
        env:
          BANK:             BDCC
          ENV:              QA
          BASE_URL:         ${{ secrets.BDCC_BASE_URL }}
          MAKER_USERNAME:   ${{ secrets.BDCC_MAKER_USERNAME }}
          MAKER_PASSWORD:   ${{ secrets.BDCC_MAKER_PASSWORD }}
          CHECKER_USERNAME: ${{ secrets.BDCC_CHECKER_USERNAME }}
          CHECKER_PASSWORD: ${{ secrets.BDCC_CHECKER_PASSWORD }}
          DB_HOST:          ${{ secrets.BDCC_DB_HOST }}
          DB_NAME:          ${{ secrets.BDCC_DB_NAME }}
          DB_USER:          ${{ secrets.BDCC_DB_USER }}
          DB_PASSWORD:      ${{ secrets.BDCC_DB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-bdcc-qa
          path: allure-results/

  # ════════════════════════════════════════════════════════════════════════════
  # BCCB — Burdwan Central Co-operative Bank (port 7999, SQL Server)
  # ════════════════════════════════════════════════════════════════════════════

  sanity-bccb:
    name: Sanity — BCCB QA
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run sanity — BCCB QA
        run: npx playwright test --grep @sanity
        env:
          BANK:             BCCB
          ENV:              QA
          BASE_URL:         ${{ secrets.BCCB_BASE_URL }}
          MAKER_USERNAME:   ${{ secrets.BCCB_MAKER_USERNAME }}
          MAKER_PASSWORD:   ${{ secrets.BCCB_MAKER_PASSWORD }}
          CHECKER_USERNAME: ${{ secrets.BCCB_CHECKER_USERNAME }}
          CHECKER_PASSWORD: ${{ secrets.BCCB_CHECKER_PASSWORD }}
          DB_HOST:          ${{ secrets.BCCB_DB_HOST }}
          DB_NAME:          ${{ secrets.BCCB_DB_NAME }}
          DB_USER:          ${{ secrets.BCCB_DB_USER }}
          DB_PASSWORD:      ${{ secrets.BCCB_DB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-bccb-qa
          path: allure-results/

  smoke-bccb:
    name: Smoke — BCCB QA
    runs-on: ubuntu-latest
    needs: sanity-bccb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke — BCCB QA
        run: npx playwright test --grep @smoke
        env:
          BANK:             BCCB
          ENV:              QA
          BASE_URL:         ${{ secrets.BCCB_BASE_URL }}
          MAKER_USERNAME:   ${{ secrets.BCCB_MAKER_USERNAME }}
          MAKER_PASSWORD:   ${{ secrets.BCCB_MAKER_PASSWORD }}
          CHECKER_USERNAME: ${{ secrets.BCCB_CHECKER_USERNAME }}
          CHECKER_PASSWORD: ${{ secrets.BCCB_CHECKER_PASSWORD }}
          DB_HOST:          ${{ secrets.BCCB_DB_HOST }}
          DB_NAME:          ${{ secrets.BCCB_DB_NAME }}
          DB_USER:          ${{ secrets.BCCB_DB_USER }}
          DB_PASSWORD:      ${{ secrets.BCCB_DB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-bccb-qa
          path: allure-results/

  # ════════════════════════════════════════════════════════════════════════════
  # Nightly regression — both banks × both envs, 8 shards each
  # ════════════════════════════════════════════════════════════════════════════

  regression:
    name: Regression — ${{ matrix.bank }} ${{ matrix.env }} Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [smoke-bdcc, smoke-bccb]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        bank:  [BDCC, BCCB]
        env:   [QA]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run regression ${{ matrix.bank }} ${{ matrix.env }} shard ${{ matrix.shard }}/8
        run: npx playwright test --grep @regression --shard=${{ matrix.shard }}/8
        env:
          BANK:             ${{ matrix.bank }}
          ENV:              ${{ matrix.env }}
          BASE_URL:         ${{ matrix.bank == 'BDCC' && secrets.BDCC_BASE_URL || secrets.BCCB_BASE_URL }}
          MAKER_USERNAME:   ${{ matrix.bank == 'BDCC' && secrets.BDCC_MAKER_USERNAME || secrets.BCCB_MAKER_USERNAME }}
          MAKER_PASSWORD:   ${{ matrix.bank == 'BDCC' && secrets.BDCC_MAKER_PASSWORD || secrets.BCCB_MAKER_PASSWORD }}
          CHECKER_USERNAME: ${{ matrix.bank == 'BDCC' && secrets.BDCC_CHECKER_USERNAME || secrets.BCCB_CHECKER_USERNAME }}
          CHECKER_PASSWORD: ${{ matrix.bank == 'BDCC' && secrets.BDCC_CHECKER_PASSWORD || secrets.BCCB_CHECKER_PASSWORD }}
          DB_HOST:          ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_HOST || secrets.BCCB_DB_HOST }}
          DB_NAME:          ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_NAME || secrets.BCCB_DB_NAME }}
          DB_USER:          ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_USER || secrets.BCCB_DB_USER }}
          DB_PASSWORD:      ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_PASSWORD || secrets.BCCB_DB_PASSWORD }}
          PARALLEL:         'true'
          WORKERS:          '5'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.bank }}-${{ matrix.env }}-shard-${{ matrix.shard }}
          path: allure-results/

  # ════════════════════════════════════════════════════════════════════════════
  # E2E — nightly, both banks
  # ════════════════════════════════════════════════════════════════════════════

  e2e:
    name: E2E — ${{ matrix.bank }} QA
    runs-on: ubuntu-latest
    needs: [smoke-bdcc, smoke-bccb]
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        bank: [BDCC, BCCB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E — ${{ matrix.bank }} QA
        run: npx playwright test --grep @e2e
        env:
          BANK:             ${{ matrix.bank }}
          ENV:              QA
          BASE_URL:         ${{ matrix.bank == 'BDCC' && secrets.BDCC_BASE_URL || secrets.BCCB_BASE_URL }}
          MAKER_USERNAME:   ${{ matrix.bank == 'BDCC' && secrets.BDCC_MAKER_USERNAME || secrets.BCCB_MAKER_USERNAME }}
          MAKER_PASSWORD:   ${{ matrix.bank == 'BDCC' && secrets.BDCC_MAKER_PASSWORD || secrets.BCCB_MAKER_PASSWORD }}
          CHECKER_USERNAME: ${{ matrix.bank == 'BDCC' && secrets.BDCC_CHECKER_USERNAME || secrets.BCCB_CHECKER_USERNAME }}
          CHECKER_PASSWORD: ${{ matrix.bank == 'BDCC' && secrets.BDCC_CHECKER_PASSWORD || secrets.BCCB_CHECKER_PASSWORD }}
          DB_HOST:          ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_HOST || secrets.BCCB_DB_HOST }}
          DB_NAME:          ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_NAME || secrets.BCCB_DB_NAME }}
          DB_USER:          ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_USER || secrets.BCCB_DB_USER }}
          DB_PASSWORD:      ${{ matrix.bank == 'BDCC' && secrets.BDCC_DB_PASSWORD || secrets.BCCB_DB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.bank }}-qa
          path: allure-results/

  # ════════════════════════════════════════════════════════════════════════════
  # Publish combined Allure report to GitHub Pages
  # ════════════════════════════════════════════════════════════════════════════

  publish-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [smoke-bdcc, smoke-bccb, regression, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'sanity-* smoke-* regression-* e2e-*'
          merge-multiple: true
          path: allure-results
      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  allure-report
